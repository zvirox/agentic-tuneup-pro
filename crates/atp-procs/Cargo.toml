[package]
name = "atp-procs"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
atp-core = { path = "../atp-core" }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.33"
thiserror = "2.0"
tokio = { version = "1.0", features = ["process", "sync", "rt", "macros", "rt-multi-thread"] }
zbus = { version = "5.5", default-features = false, features = ["tokio"] }
