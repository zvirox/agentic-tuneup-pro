[[rule]]
id = "rust-target-dirs"
name = "Rust Target Directories"
category = "dev"
description = "Compiled Rust build artifacts in target/ directories"
paths = ["**/target/debug/*", "**/target/release/*"]
requires_closed = ["cargo", "rust-analyzer"]
risk_tier = 2
explanation = "Intermediate compiler build artifacts. Recreated on-demand via `cargo build`."

[[rule]]
id = "stale-node-modules"
name = "Stale node_modules"
category = "dev"
description = "Node.js dependencies in projects untouched for 90+ days"
paths = ["**/node_modules/*"]
requires_closed = []
risk_tier = 2
explanation = "Downloaded npm packages. Rebuilt whenever needed via `npm install` or `pnpm install`."

[[rule]]
id = "python-pycache"
name = "Python Bytecode (__pycache__)"
category = "dev"
description = "Precompiled Python .pyc and .pyo files in __pycache__ folders"
paths = ["**/__pycache__/*", "**/*.pyc"]
requires_closed = ["python", "python3"]
risk_tier = 2
explanation = "Python bytecode cache. Automatically regenerated when Python scripts execute."
