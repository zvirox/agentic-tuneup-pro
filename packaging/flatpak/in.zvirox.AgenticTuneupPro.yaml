app-id: in.zvirox.AgenticTuneupPro
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: agentic-tuneup-pro

finish-args:
  # Display & IPC
  - --share=ipc
  - --socket=x11
  - --socket=fallback-x11
  - --socket=wayland

  # Audio (Whisper Dictation) & Network
  - --socket=pulseaudio
  - --share=network

  # D-Bus & Notifications
  - --socket=session-bus
  - --socket=system-bus
  - --system-talk-name=in.zvirox.AgenticTuneupHelper
  - --system-talk-name=org.freedesktop.systemd1
  - --talk-name=org.freedesktop.Notifications

  # Filesystem Access for Cleaner Scanning & Quarantine
  - --filesystem=host:ro
  - --filesystem=home
  - --filesystem=xdg-cache
  - --filesystem=xdg-config
  - --filesystem=xdg-data
  - --filesystem=/var/cache:ro
  - --filesystem=/var/log:ro
  - --filesystem=xdg-run/starship:create

modules:
  - name: agentic-tuneup-pro
    buildsystem: simple
    build-commands:
      # Install main binary
      - install -Dm755 agentic-tuneup-pro /app/bin/agentic-tuneup-pro

      # Install desktop file & AppStream metadata
      - install -Dm644 packaging/agentic-tuneup-pro.desktop /app/share/applications/in.zvirox.AgenticTuneupPro.desktop
      - install -Dm644 packaging/in.zvirox.agentictuneuppro.metainfo.xml /app/share/metainfo/in.zvirox.AgenticTuneupPro.metainfo.xml

      # Install icons
      - install -Dm644 packaging/in.zvirox.agentictuneuppro.svg /app/share/icons/hicolor/scalable/apps/in.zvirox.AgenticTuneupPro.svg
      - install -Dm644 app/src-tauri/icons/128x128.png /app/share/icons/hicolor/128x128/apps/in.zvirox.AgenticTuneupPro.png
      - install -Dm644 app/src-tauri/icons/64x64.png /app/share/icons/hicolor/64x64/apps/in.zvirox.AgenticTuneupPro.png
      - install -Dm644 app/src-tauri/icons/32x32.png /app/share/icons/hicolor/32x32/apps/in.zvirox.AgenticTuneupPro.png
    sources:
      - type: dir
        path: ../../
