name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    uses: zvirox/release-workflows/.github/workflows/linux-release.yml@v1
    with:
      app_name: agentic-tuneup-pro
      frontend_dir: app
      binary_path: target/release/agentic-tuneup-pro
      extra_binaries_cmd: cargo build --release --locked -p atpd-helper
      nfpm_config: packaging/nfpm.yaml
    secrets: inherit
