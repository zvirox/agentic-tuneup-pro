<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="banner-title banner-desc">
  <title id="banner-title">Agentic Tuneup Pro</title>
  <desc id="banner-desc">Sovereign AI-orchestrated Linux cleaner and performance suite</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B10"/>
      <stop offset="60%" stop-color="#0B111A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="carGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <linearGradient id="wrenchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Frame -->
  <rect width="1280" height="320" rx="20" fill="url(#bgGrad)"/>
  <rect width="1280" height="320" rx="20" fill="none" stroke="#1E293B" stroke-width="2"/>

  <!-- Starship Grid Accent Rings -->
  <g fill="none" stroke="#38BDF8" stroke-width="1.5">
    <circle cx="1080" cy="160" r="140" stroke-opacity="0.1" stroke-dasharray="6 6"/>
    <circle cx="1080" cy="160" r="190" stroke-opacity="0.06"/>
    <circle cx="1080" cy="160" r="240" stroke-opacity="0.03" stroke-dasharray="12 12"/>
  </g>

  <!-- Left Content: Title, Pill, Tagline -->
  <g transform="translate(80, 0)">
    <!-- Pill Badge -->
    <rect x="0" y="52" width="224" height="28" rx="14" fill="#0F172A" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="14" cy="66" r="4" fill="#38BDF8" filter="url(#glow)"/>
    <text x="26" y="70" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600" fill="#38BDF8" letter-spacing="1">MOTHER SHIP · v0.0.1-ALPHA</text>

    <!-- Main Title -->
    <text x="0" y="152" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="#F8FAFC" letter-spacing="-1">Agentic Tuneup Pro</text>

    <!-- Cyan Accent Bar -->
    <rect x="0" y="172" width="72" height="5" rx="2.5" fill="url(#cyanGrad)"/>

    <!-- Tagline -->
    <text x="0" y="222" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#94A3B8">Sovereign AI-orchestrated Linux cleaner &amp; performance suite</text>

    <!-- Safety Invariant Markers -->
    <g transform="translate(0, 260)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#64748B">
      <text x="0" y="0">✓ Zero Unquarantined Deletions</text>
      <text x="230" y="0">✓ Zero-Shell Execution</text>
      <text x="410" y="0">✓ Starship MCP Bridge</text>
    </g>
  </g>

  <!-- Right Visual Emblem: Stylized Car & Tuneup Wrench -->
  <g transform="translate(980, 50)">
    <!-- Ambient Glow Behind Emblem -->
    <circle cx="100" cy="110" r="90" fill="#38BDF8" fill-opacity="0.08" filter="url(#glow)"/>

    <!-- Car Body -->
    <g transform="translate(10, 45)">
      <!-- Wheels -->
      <rect x="25" y="105" width="28" height="18" rx="8" fill="#0B132B"/>
      <rect x="95" y="105" width="28" height="18" rx="8" fill="#0B132B"/>
      <!-- Main Shell -->
      <path d="M15 105 C15 70 30 50 50 48 L75 48 C95 48 115 65 125 80 L135 85 C142 85 145 92 145 105 L15 105 Z" fill="url(#carGrad)"/>
      <!-- Side Mirror -->
      <rect x="5" y="70" width="16" height="12" rx="6" fill="#E11D48"/>
      <!-- Windshield / Cabin -->
      <path d="M50 48 L75 48 C85 48 95 58 102 70 L42 70 C44 58 47 48 50 48 Z" fill="#0F172A" fill-opacity="0.6"/>
      <!-- Headlight -->
      <ellipse cx="28" cy="85" rx="14" ry="10" fill="#FBBF24"/>
      <!-- Grille Slits -->
      <rect x="55" y="86" width="18" height="4" rx="2" fill="#BE123C"/>
      <rect x="55" y="93" width="18" height="4" rx="2" fill="#BE123C"/>
    </g>

    <!-- Vertical Tuneup Wrench in Front -->
    <g transform="translate(95, 10)">
      <!-- Wrench Head Open End -->
      <path d="M25 0 C12 0 0 12 0 26 C0 38 8 48 18 52 L18 135 C18 142 22 148 28 152 C20 156 15 165 15 175 C15 190 27 202 42 202 C57 202 69 190 69 175 C69 165 64 156 56 152 C62 148 66 142 66 135 L66 52 C76 48 84 38 84 26 C84 12 72 0 59 0 C50 0 45 8 42 16 C39 8 34 0 25 0 Z" fill="url(#wrenchGrad)"/>
      <!-- Wrench Cutout Mouth -->
      <path d="M28 0 C32 18 52 18 56 0 L66 16 C58 32 26 32 18 16 Z" fill="#0B111A"/>
      <!-- Inner Shaft Grip Recess -->
      <rect x="36" y="65" width="12" height="55" rx="6" fill="#FEF08A"/>
      <!-- Bottom Hole Ring -->
      <circle cx="42" cy="175" r="14" fill="#FEF08A"/>
      <!-- Fastener Dots -->
      <circle cx="30" cy="46" r="3" fill="#0F766E"/>
      <circle cx="42" cy="46" r="3" fill="#0F766E"/>
      <circle cx="54" cy="46" r="3" fill="#0F766E"/>
    </g>
  </g>
</svg>
