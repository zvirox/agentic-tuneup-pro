[workspace]
members = [
    "crates/atp-core",
    "crates/atp-safety",
    "crates/atp-cleaner",
    "crates/atp-pkg",
    "crates/atp-monitor",
    "crates/atp-procs",
    "crates/atp-mcp",
    "crates/atp-voice",
    "crates/atpd-helper",
    "app/src-tauri",
]
resolver = "3"

[workspace.package]
version = "0.1.0-beta.1"
edition = "2024"
license = "Apache-2.0"
authors = ["Zvirox <cyber@zvirox.in>"]

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
missing_errors_doc = "allow"
module_name_repetitions = "allow"

[workspace.lints.cargo]
unused_dependencies = "allow"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = true
